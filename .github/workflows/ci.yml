name: CloudOps360 Advanced CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js for caching test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install & Test
      - name: Install dependencies
        run: npm ci || echo "No package.json found, skipping npm ci"

      # 4. Save website file as an Artifact
      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudops360-html-artifact
          path: index.html
