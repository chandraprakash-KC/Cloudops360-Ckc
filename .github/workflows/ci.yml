name: CloudOps360 CI & Artifacts

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Verify static website file exists
      - name: Verify website file
        run: test -f index.html && echo "CloudOps360 index.html verified successfully!"

      # 3. Save website file as a Cloud Artifact
      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudops360-html-artifact
          path: index.html
